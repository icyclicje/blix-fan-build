<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>{{TITLE}}</title>
<link rel="icon" href="{{ICON}}">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<script>
(function () {
  var src = {{ENTRY}} + location.search + location.hash;
  // When framed (the game navigated back to "/", or the site is embedded elsewhere), show the game itself.
  if (top !== self) return location.replace(src);
  var f = document.createElement('iframe');
  f.src = src;
  f.title = document.title;
  f.allow = 'autoplay; fullscreen; gamepad; clipboard-write; cross-origin-isolated; screen-wake-lock; accelerometer; gyroscope; xr-spatial-tracking';
  f.allowFullscreen = true;
  // Keep keyboard input going to the game.
  function focus() { try { f.contentWindow.focus(); } catch (e) {} }
  f.onload = focus;
  addEventListener('focus', focus);
  document.body.appendChild(f);
})();
</script>
</body>
</html>
